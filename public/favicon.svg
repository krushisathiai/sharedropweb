<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#e11d48" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- ShareDrop Brand Rounded Square -->
  <rect width="64" height="64" rx="16" fill="url(#roseGradient)" filter="url(#shadow)" />
  <!-- Brand Lightning Zap Icon -->
  <g transform="translate(8, 8) scale(2)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
